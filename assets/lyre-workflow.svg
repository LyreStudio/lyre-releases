<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Build locally. Take it with you.</title>
  <desc id="desc">Build on your computer with local models, agents, and tools. Validate against the real app with live previews, tests, and diffs. Continue across devices through remote access and app sharing.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111822"/><stop offset="1" stop-color="#0b1018"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8cbcff"/><stop offset="1" stop-color="#b6acf5"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="538" rx="24" fill="url(#bg)" stroke="#293345" stroke-width="2"/>
  <path d="M930 1v295M1000 1v295M1070 1v295M1140 1v295M880 68h319M880 138h319M880 208h319M880 278h319" stroke="#1c2a3c"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="44" y="58" fill="#a6b7ce" font-size="18" font-weight="600" letter-spacing="3">LYRE STUDIO / LOCAL-FIRST DEVELOPMENT</text>
    <text x="40" y="150" fill="#f5f7fb" font-size="74" font-weight="700" letter-spacing="-2">Build locally.</text>
    <text x="40" y="234" fill="url(#accent)" font-size="74" font-weight="700" letter-spacing="-2">Take it with you.</text>
    <text x="44" y="289" fill="#bac6d6" font-size="27">Your models. Your projects. Connected across devices.</text>
    <g transform="translate(40 338)">
      <rect width="360" height="158" rx="14" fill="#151e2b" stroke="#314158"/>
      <text x="24" y="36" fill="#8cbcff" font-size="17" font-weight="700" letter-spacing="2">01 / BUILD</text>
      <text x="24" y="84" fill="#f5f7fb" font-size="29" font-weight="650">On your computer</text>
      <text x="24" y="123" fill="#b9c5d6" font-size="20">Local models · agents · tools</text>
    </g>
    <g transform="translate(420 338)">
      <rect width="360" height="158" rx="14" fill="#151e2b" stroke="#314158"/>
      <text x="24" y="36" fill="#a1b3fc" font-size="17" font-weight="700" letter-spacing="2">02 / VALIDATE</text>
      <text x="24" y="84" fill="#f5f7fb" font-size="29" font-weight="650">Against the real app</text>
      <text x="24" y="123" fill="#b9c5d6" font-size="20">Live previews · tests · diffs</text>
    </g>
    <g transform="translate(800 338)">
      <rect width="360" height="158" rx="14" fill="#151e2b" stroke="#314158"/>
      <text x="24" y="36" fill="#b6acf5" font-size="17" font-weight="700" letter-spacing="2">03 / TAKE IT WITH YOU</text>
      <text x="24" y="84" fill="#f5f7fb" font-size="29" font-weight="650">Across your devices</text>
      <text x="24" y="123" fill="#b9c5d6" font-size="20">Remote access · app sharing</text>
