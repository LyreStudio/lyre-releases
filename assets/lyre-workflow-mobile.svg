<svg xmlns="http://www.w3.org/2000/svg" width="600" height="940" viewBox="0 0 600 940" role="img" aria-labelledby="title desc">
  <title id="title">Build locally. Take it with you.</title>
  <desc id="desc">Build on your computer with local models, agents, and tools. Validate against the real app with live previews, tests, and diffs. Continue across devices through remote access and app sharing.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111822"/><stop offset="1" stop-color="#0b1018"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8cbcff"/><stop offset="1" stop-color="#b6acf5"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="938" rx="24" fill="url(#bg)" stroke="#293345" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="36" y="57" fill="#a6b7ce" font-size="20" font-weight="600" letter-spacing="2">LYRE STUDIO / LOCAL-FIRST</text>
    <text x="32" y="145" fill="#f5f7fb" font-size="59" font-weight="700" letter-spacing="-2">Build locally.</text>
    <text x="32" y="215" fill="url(#accent)" font-size="59" font-weight="700" letter-spacing="-2">Take it with you.</text>
    <text x="36" y="269" fill="#bac6d6" font-size="25">Your models. Your projects.</text>
    <text x="36" y="304" fill="#bac6d6" font-size="25">Connected across devices.</text>
    <g transform="translate(32 350)">
      <rect width="536" height="166" rx="14" fill="#151e2b" stroke="#314158"/>
      <text x="28" y="39" fill="#8cbcff" font-size="20" font-weight="700" letter-spacing="2">01 / BUILD</text>
      <text x="28" y="90" fill="#f5f7fb" font-size="36" font-weight="650">On your computer</text>
      <text x="28" y="133" fill="#b9c5d6" font-size="25">Local models · agents · tools</text>
    </g>
    <g transform="translate(32 538)">
      <rect width="536" height="166" rx="14" fill="#151e2b" stroke="#314158"/>
      <text x="28" y="39" fill="#a1b3fc" font-size="20" font-weight="700" letter-spacing="2">02 / VALIDATE</text>
      <text x="28" y="90" fill="#f5f7fb" font-size="36" font-weight="650">Against the real app</text>
      <text x="28" y="133" fill="#b9c5d6" font-size="25">Live previews · tests · diffs</text>
    </g>
    <g transform="translate(32 726)">
      <rect width="536" height="166" rx="14" fill="#151e2b" stroke="#314158"/>
      <text x="28" y="39" fill="#b6acf5" font-size="20" font-weight="700" letter-spacing="2">03 / TAKE IT WITH YOU</text>
      <text x="28" y="90" fill="#f5f7fb" font-size="36" font-weight="650">Across your devices</text>
      <text x="28" y="133" fill="#b9c5d6" font-size="25">Remote access · app sharing</text>
    </g>
  </g>
</svg>
